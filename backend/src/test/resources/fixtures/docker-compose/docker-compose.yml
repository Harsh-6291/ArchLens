version: '3.8'

services:
  web-api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://user:super_secret_password@postgres:5432/main_db
      - REDIS_PASSWORD=secret_redis_pass_123

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: main_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: super_secret_password

  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  message-queue:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
