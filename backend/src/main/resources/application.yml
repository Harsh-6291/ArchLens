spring:
  application:
    name: archlens-backend
  datasource:
    url: jdbc:postgresql://127.0.0.1:5434/archlens_db
    username: archlens_user
    password: archlens_password
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: archlens_rmq
    password: archlens_rmq_pass
    listener:
      simple:
        default-requeue-rejected: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
